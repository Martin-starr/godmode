name: SEO setup-sjekk

# Verifiserer at hver hemmelighet SEO-ukesjobben trenger faktisk virker, uten
# å kjøre selve innsamlingen. Ukesjobben bruker tjue minutter før den rører
# Search Console; denne bruker sekunder og sier hvilken verdi som er feil.
#
# Ingen hemmelighet skrives ut — bare navnet og om den virket.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Sjekk oppsettet
        env:
          DASH_DATABASE_URL: ${{ secrets.DASH_DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEO_BRIEF_EMAIL: ${{ secrets.SEO_BRIEF_EMAIL }}
        run: node seo/setup-check.mjs
