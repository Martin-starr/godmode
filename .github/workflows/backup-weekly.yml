name: Ukentlig backup

# Supabase tar ingen automatiske backups på Free-planen. Denne jobben dumper
# dash- og seo-skjemaene hver søndag natt og legger kopien som en GitHub
# Release i dette repoet (Martins konto, utløper ikke). Kopier eldre enn 90
# dager ryddes. Samme fil lastes også opp som artefakt (90 dager).
#
# Google Drive var førstevalget, men Google gir ikke service-kontoer lagrings-
# kvote i «Min disk», og Workspace-planen har ikke Delte disker. Settes
# repo-variabelen BACKUP_DRIVE_FOLDER_ID til en delt disk senere, laster
# skriptet opp dit i tillegg.

on:
  schedule:
    - cron: "10 2 * * 0"   # søndag 02:10 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-weekly
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pg_dump 17 (server is Postgres 17)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and upload
        env:
          DASH_DATABASE_URL: ${{ secrets.DASH_DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BACKUP_DRIVE_FOLDER_ID: ${{ vars.BACKUP_DRIVE_FOLDER_ID }}
          PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: node dash-scripts/backup.mjs

      - name: Publish as GitHub Release (kept 90 days)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=$(ls backup/*.sql.gz | head -1)
          [ -f "$FILE" ] || { echo "::error::ingen dump å publisere"; exit 1; }
          TAG="backup-$(date -u +%Y-%m-%d_%H%M)"
          gh release create "$TAG" "$FILE" --title "Backup $TAG" \
            --notes "Ukentlig dump av dash- og seo-skjemaene ($(du -h "$FILE" | cut -f1)). Gjenopprett med: gunzip -c FIL | psql <tilkoblingsstreng>"
          echo "publisert: $TAG"
          CUTOFF=$(date -u -d '90 days ago' +%Y-%m-%d)
          gh release list --limit 200 --json tagName -q '.[].tagName' | grep '^backup-' | while read -r t; do
            d=${t#backup-}; d=${d%%_*}
            if [[ "$d" < "$CUTOFF" ]]; then gh release delete "$t" --cleanup-tag --yes && echo "slettet gammel: $t"; fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dash-backup-${{ github.run_id }}
          path: backup/*.sql.gz
          retention-days: 90
          if-no-files-found: warn
