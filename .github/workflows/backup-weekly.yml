name: Ukentlig backup

# Supabase tar ingen automatiske backups på Free-planen. Denne jobben dumper
# dash- og seo-skjemaene hver søndag natt og legger kopien i Martins Google
# Drive-mappe «Verminord dash-backup», delt med SEO-agentens service-konto.
# Kopien lastes også opp som artefakt her (90 dager) som ekstra sikkerhet.

on:
  schedule:
    - cron: "10 2 * * 0"   # søndag 02:10 UTC
  workflow_dispatch:

concurrency:
  group: backup-weekly
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pg_dump 17 (server is Postgres 17)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Dump and upload
        env:
          DASH_DATABASE_URL: ${{ secrets.DASH_DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BACKUP_DRIVE_FOLDER_ID: ${{ vars.BACKUP_DRIVE_FOLDER_ID || '197VPNEsH9HB_r9WbBYNgQLWdWiZTsNI3' }}
        run: node dash-scripts/backup.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: dash-backup-${{ github.run_id }}
          path: backup/*.sql.gz
          retention-days: 90
          if-no-files-found: error
